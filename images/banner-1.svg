  </defs>
  <rect width="1400" height="520" fill="url(#bg1)"/>
  <circle cx="1150" cy="140" r="220" fill="#ff9900" opacity="0.14"/>
  <circle cx="200" cy="80" r="160" fill="#00bcd4" opacity="0.09"/>
  
