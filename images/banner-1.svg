    <path d="M 15 210 L 365 210 L 350 225 L 30 225 Z" fill="#334155"/>
    <rect x="290" y="70" width="85" height="150" rx="14" fill="#020617" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="332" cy="85" r="4" fill="#38BDF8"/>
